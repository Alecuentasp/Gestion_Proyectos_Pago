name: Generar reporte mensual

on:
  push:
    paths:
      - 'data/ejemplo_facturacion.csv'   # Se dispara solo si cambia el CSV
  workflow_dispatch:                     # También se puede lanzar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Ejecutar script de cálculo
        run: |
          FECHA=$(date +%Y-%m-%d_%H-%M)
          python scripts/calculo_pagos.py data/ejemplo_facturacion.csv reports/reporte_${FECHA}.xlsx

      - name: Commit y push del reporte
        run: |
          FECHA=$(date +%Y-%m-%d_%H-%M)
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add reports/reporte_${FECHA}.xlsx
          git commit -m "Reporte generado automáticamente el $FECHA"
          git push
