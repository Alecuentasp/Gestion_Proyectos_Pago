name: Generar reporte mensual

on:
  workflow_dispatch:   # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Ejecutar script de cálculo
        run: python scripts/calculo_pagos.py data/ejemplo_facturacion.csv reports/reporte_mensual.xlsx

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte_mensual
          path: reports/reporte_mensual.xlsx

